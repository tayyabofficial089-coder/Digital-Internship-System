<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Internship</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-building"></i> Company Dashboard</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header"><i class="fas fa-plus-circle"></i> Post New Internship</div>
                    <div class="card-body">
                        <form id="postForm">
                            <div class="mb-3">
                                <label class="form-label">Internship Title *</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description *</label>
                                <textarea class="form-control" id="description" rows="4" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Requirements</label>
                                <textarea class="form-control" id="requirements" rows="3"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Location</label>
                                    <input type="text" class="form-control" id="location" placeholder="e.g. Lahore">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Duration</label>
                                    <select class="form-select" id="duration">
                                        <option value="" disabled selected>Select duration</option>
                                        <option value="1 month">1 month</option>
                                        <option value="2 months">2 months</option>
                                        <option value="3 months">3 months</option>
                                        <option value="6 months">6 months</option>
                                        <option value="1 year">1 year</option>
                                        <option value="Flexible">Flexible</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stipend</label>
                                    <select class="form-select" id="stipend">
                                        <option value="" disabled selected>Select stipend</option>
                                        <option value="Unpaid">Unpaid</option>
                                        <option value="Rs. 5,000 - 10,000">Rs. 5,000 - 10,000</option>
                                        <option value="Rs. 10,000 - 20,000">Rs. 10,000 - 20,000</option>
                                        <option value="Rs. 20,000 - 30,000">Rs. 20,000 - 30,000</option>
                                        <option value="Rs. 30,000 - 50,000">Rs. 30,000 - 50,000</option>
                                        <option value="Above Rs. 50,000">Above Rs. 50,000</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Positions Available</label>
                                    <input type="number" class="form-control" id="positions" value="1" min="1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Application Deadline *</label>
                                <input type="date" class="form-control" id="deadline" required>
                            </div>
                            <button type="button" class="btn btn-primary" id="postBtn"><i class="fas fa-paper-plane"></i> Post Internship</button>
                            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/company.js"></script>
    <script>
        const user = getUser();
        if (user) document.getElementById('userName').textContent = user.name;
    </script>
</body>
</html>
