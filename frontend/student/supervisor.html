<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Supervisor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-graduation-cap"></i> Student Dashboard</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>

        <h2><i class="fas fa-user-tie"></i> My Supervisor</h2>
        <hr>
        <div id="supervisorDetails">
            <p class="text-muted">Loading...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/student.js"></script>
    <script>
        async function loadMySupervisor() {
            const box = document.getElementById('supervisorDetails');
            try {
                const res = await fetch(`${API_URL}/student/supervisor`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();

                if (result.success && result.data) {
                    const s = result.data;
                    box.innerHTML = `
                        <div class="card">
                            <div class="card-body">
                                <table class="table table-borderless mb-0">
                                    <tr><th style="width:180px">Name</th><td>${s.name}</td></tr>
                                    <tr><th>Email</th><td>${s.email}</td></tr>
                                    <tr><th>Company</th><td>${s.companyName || '-'}</td></tr>
                                    <tr><th>Designation</th><td>${s.designation || '-'}</td></tr>
                                    <tr><th>Department</th><td>${s.department || '-'}</td></tr>
                                    <tr><th>Phone</th><td>${s.phone || '-'}</td></tr>
                                </table>
                            </div>
                        </div>`;
                } else {
                    box.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-user-clock fa-3x text-muted mb-3"></i>
                            <h5>No supervisor assigned yet</h5>
                            <p class="text-muted">Your supervisor will appear here once the company assigns one to you.</p>
                        </div>`;
                }
            } catch (err) {
                console.error('Load supervisor error:', err);
                box.innerHTML = '<p class="text-danger">Could not load supervisor details. Please try again.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            const user = getUser();
            if (user) document.getElementById('userName').textContent = user.name;
            loadMySupervisor();
        });
    </script>
</body>
</html>
