<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Internships</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: #f0f2f5;
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #4A6CF7, #6a8cfa);
            box-shadow: 0 4px 20px rgba(74,108,247,0.3);
            padding: 12px 0;
        }
        
        .navbar-custom .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        
        .navbar-custom .navbar-brand i {
            margin-right: 8px;
        }
        
        .text-white-custom {
            color: white !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .card .card-body {
            padding: 22px;
        }
        
        .card .card-body .internship-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .card .card-body .company-name {
            color: #4A6CF7;
            font-weight: 600;
            font-size: 14px;
        }
        
        .card .card-body .detail-item {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 4px;
        }
        
        .card .card-body .detail-item i {
            width: 18px;
            color: #4A6CF7;
        }
        
        .card .card-body .badge-deadline {
            background: #fff3cd;
            color: #856404;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .btn-apply {
            background: linear-gradient(135deg, #4A6CF7, #6a8cfa);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74,108,247,0.4);
            color: white;
        }
        
        .btn-apply:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-applied {
            background: #d4edda;
            color: #155724;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: default;
        }
        
        .search-box {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 10px 18px;
            height: 48px;
            width: 100%;
            max-width: 350px;
            transition: all 0.3s ease;
        }
        
        .search-box:focus {
            border-color: #4A6CF7;
            box-shadow: 0 0 0 4px rgba(74,108,247,0.12);
            outline: none;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state i {
            font-size: 60px;
            color: #d1d5db;
            margin-bottom: 20px;
        }
        
        .empty-state h5 {
            color: #1a1a2e;
            font-weight: 600;
        }
        
        .empty-state p {
            color: #6c757d;
        }
        
        .alert {
            border-radius: 10px;
        }
        
        .filter-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }@media (max-width: 576px) {
            .search-box {
                max-width: 100%;
        }
        
        .filter-section {
            flex-direction: column;
            align-items: stretch;
        }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-graduation-cap"></i> Student Dashboard
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white-custom me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container mt-4">
        <div id="alertContainer"></div>

        <!-- ===== HEADER ===== -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
            <div>
                <h2><i class="fas fa-briefcase text-primary"></i> Browse Internships</h2>
                <p class="text-muted">Find and apply for internship opportunities</p>
            </div>
            <div class="filter-section">
                <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search internships...">
                <button class="btn btn-primary" onclick="searchInternships()">
                    <i class="fas fa-search"></i> Search
                </button>
                <button class="btn btn-outline-secondary" onclick="clearSearch()">
                    <i class="fas fa-times"></i> Clear
                </button>
            </div>
        </div>

        <!-- ===== INTERNSHIPS LIST ===== -->
        <div id="internshipsList">
            <div class="text-center py-5">
                <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                <p class="mt-3 text-muted">Loading internships...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        // ==================== CHECK AUTH ====================
        if (!token) {
            window.location.href = '../login.html';
        }

        // ==================== LOGOUT ====================
        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../index.html';
        });

        // ==================== USER DATA ====================
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('userName').textContent = user.name || 'Student';

        // ==================== SHOW ALERT ====================
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
            `;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // ==================== LOAD INTERNSHIPS ====================
        async function loadInternships(search = '') {
            try {
                let url = `${API_URL}/student/internships`;
                if (search) {
                    url += `?search=${encodeURIComponent(search)}`;
                }

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();

                if (result.success) {
                    const container = document.getElementById('internshipsList');

                    if (result.data.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <h5>${search ? 'No internships found matching "' + search + '"' : 'No Internships Available'}</h5>
                                <p>${search ? 'Try a different search term' : 'Check back later for new opportunities'}</p>
                                ${search ? '<button class="btn btn-primary" onclick="clearSearch()"><i class="fas fa-times"></i> Clear Search</button>' : ''}
                            </div>
                        `;
                        return;
                    }

                    let html = '<div class="row">';
                    result.data.forEach(internship => {
                        const isDeadlinePassed = new Date(internship.deadline) < new Date();

                        html += `
                            <div class="col-md-4 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="internship-title">${internship.title}</div>
                                        <div class="company-name"><i class="fas fa-building"></i> ${internship.companyName}</div>
                                        <hr>
                                        <div class="detail-item"><i class="fas fa-map-marker-alt"></i> ${internship.location || 'Remote'}</div>
                                        <div class="detail-item"><i class="fas fa-clock"></i> ${internship.duration || 'Not specified'}</div>
                                        <div class="detail-item"><i class="fas fa-money-bill"></i> ${internship.stipend || 'Unpaid'}</div>
                                        <div class="detail-item"><i class="fas fa-user"></i> ${internship.positionsAvailable} position${internship.positionsAvailable > 1 ? 's' : ''}</div>
                                        <div class="detail-item">
                                            <i class="fas fa-calendar-alt"></i> Deadline: 
                                            <span class="${isDeadlinePassed ? 'text-danger' : ''}">${new Date(internship.deadline).toLocaleDateString()}</span>
                                            ${isDeadlinePassed ? '<span class="badge-deadline ms-2">Passed</span>' : ''}
                                        </div>
                                        <hr>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="badge ${internship.status === 'open' ? 'bg-success' : 'bg-secondary'}">${internship.status.toUpperCase()}</span>
                                            ${internship.hasApplied ? 
                                                `<span class="btn-applied"><i class="fas fa-check"></i> Applied</span>` :
                                                isDeadlinePassed || internship.status !== 'open' ?
                                                    `<button class="btn-apply" disabled><i class="fas fa-times"></i> Closed</button>` :
                                                    `<a href="apply-internship.html?id=${internship.id}" class="btn-apply"><i class="fas fa-paper-plane"></i> Apply Now</a>`
                                            }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                } else {
                    showAlert(result.message || 'Failed to load internships', 'danger');
                }
            } catch (error) {
                console.error('Error loading internships:', error);
                showAlert('Server error. Please try again.', 'danger');
            }
        }

        // ==================== SEARCH ====================
        function searchInternships() {
            const search = document.getElementById('searchInput').value.trim();
            loadInternships(search);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            loadInternships();
        }

        // ==================== ENTER KEY SEARCH ====================
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchInternships();
            }
        });

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadInternships();
        });
    </script>

</body>
</html>
