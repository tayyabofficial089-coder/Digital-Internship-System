<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Digital Internship</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 25px 35px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .register-card .logo {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .register-card .logo h2 {
            color: #4A6CF7;
            font-weight: 700;
        }
        
        .register-card .logo p {
            color: #6c757d;
            font-size: 13px;
        }
        
        .register-card .form-control, .register-card .form-select {
            border-radius: 10px;
            padding: 8px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            height: 42px;
            background: #fafbfc;
            font-size: 14px;
        }
        
        .register-card .form-control:focus, .register-card .form-select:focus {
            border-color: #4A6CF7;
            box-shadow: 0 0 0 0.2rem rgba(74, 108, 247, 0.25);
            background: #ffffff;
        }
        
        .register-card .form-label {
            font-weight: 600;
            color: #343a40;
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        #registerBtn {
            background: linear-gradient(135deg, #4A6CF7, #6a8cfa);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            color: white;
            width: 250px;
            display: block;
            margin: 15px auto 0 auto;
        }
        
        #registerBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(74, 108, 247, 0.4);
        }
        
        #registerBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .register-card .login-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .register-card .login-link a {
            color: #4A6CF7;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-card .login-link a:hover {
            text-decoration: underline;
        }
        
        .register-card .home-link {
            text-align: center;
            margin-top: 5px;
        }
        
        .register-card .home-link a {
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }
        
        .register-card .home-link a:hover {
            color: #4A6CF7;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }

        /* ===== PASSWORD FIELD ===== */
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper .form-control {
            padding-right: 40px;
        }
        
        .password-wrapper .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #adb5bd;
            background: transparent;
            border: none;
            padding: 5px 8px;
            font-size: 16px;
            z-index: 5;
            line-height: 1;
        }
        
        .password-wrapper .password-toggle:hover {
            color: #4A6CF7;
        }
        
        /* ===== INPUT WITH ICON ===== */
        .input-icon {
            position: relative;
        }
        
        .input-icon .icon-left, .password-wrapper .icon-left {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            z-index: 2;
            font-size: 14px;
        }
        
        .input-icon .form-control, .input-icon .form-select, .password-wrapper .form-control {
            padding-left: 40px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 576px) {
            .register-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="register-card">
        <!-- ===== HEADER ===== -->
        <div class="logo">
            <h2><i class="fas fa-graduation-cap"></i> Digital Internship</h2>
            <p>Student Registration</p>
        </div>

        <!-- ===== ALERT ===== -->
        <div id="alertContainer"></div>

        <!-- ===== STUDENT FORM ===== -->
        <form id="registerForm" onsubmit="return registerStudent(event)">
            
            <div class="row">
                <!-- ===== FIRST NAME ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-user me-2"></i>First Name *</label>
                    <div class="input-icon">
                        <i class="fas fa-user icon-left"></i>
                        <input type="text" class="form-control" id="firstName" placeholder="Enter first name" required>
                    </div>
                </div>

                <!-- ===== LAST NAME ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-user me-2"></i>Last Name *</label>
                    <div class="input-icon">
                        <i class="fas fa-user icon-left"></i>
                        <input type="text" class="form-control" id="lastName" placeholder="Enter last name" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- ===== EMAIL ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-envelope me-2"></i>Email Address *</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope icon-left"></i>
                        <input type="email" class="form-control" id="email" placeholder="Enter email address" required>
                    </div>
                </div>

                <!-- ===== PHONE ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-phone me-2"></i>Phone Number *</label>
                    <div class="input-icon">
                        <i class="fas fa-phone icon-left"></i>
                        <input type="text" class="form-control" id="phone" placeholder="Enter phone number" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- ===== ROLL NUMBER ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-id-card me-2"></i>Roll Number *</label>
                    <div class="input-icon">
                        <i class="fas fa-id-card icon-left"></i>
                        <input type="text" class="form-control" id="rollNumber" placeholder="e.g. 2022-KS-389" required>
                    </div>
                </div>

                <!-- ===== CGPA ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-star me-2"></i>CGPA *</label>
                    <div class="input-icon">
                        <i class="fas fa-star icon-left"></i>
                        <input type="number" class="form-control" id="cgpa" placeholder="3.50" step="0.01" min="0" max="4" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- ===== EDUCATION LEVEL ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-graduation-cap me-2"></i>Education Level *</label>
                    <div class="input-icon">
                        <i class="fas fa-graduation-cap icon-left"></i>
                        <select class="form-select" id="educationLevel" required>
                            <option value="">Select Education</option>
                            <option value="High School">High School</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Bachelor">Bachelor</option>
                            <option value="Master">Master</option>
                            <option value="PhD">PhD</option>
                        </select>
                    </div>
                </div>

                <!-- ===== SEMESTER ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-layer-group me-2"></i>Semester *</label>
                    <div class="input-icon">
                        <i class="fas fa-layer-group icon-left"></i>
                        <select class="form-select" id="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1st">1st Semester</option>
                            <option value="2nd">2nd Semester</option>
                            <option value="3rd">3rd Semester</option>
                            <option value="4th">4th Semester</option>
                            <option value="5th">5th Semester</option>
                            <option value="6th">6th Semester</option>
                            <option value="7th">7th Semester</option>
                            <option value="8th">8th Semester</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- ===== DEPARTMENT ===== -->
                <div class="col-md-12 mb-2">
                    <label class="form-label"><i class="fas fa-book me-2"></i>Department / Field of Study *</label>
                    <div class="input-icon">
                        <i class="fas fa-book icon-left"></i>
                        <select class="form-select" id="department" required>
                            <option value="" disabled selected>Select your field of study</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Cyber Security">Cyber Security</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- ===== PASSWORD ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-lock me-2"></i>Password *</label>
                    <div class="password-wrapper">
                        <i class="fas fa-lock icon-left"></i>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required minlength="8">
                        <button type="button" class="password-toggle" onclick="togglePassword('password', 'passIcon')" tabindex="-1">
                            <i class="fas fa-eye" id="passIcon"></i>
                        </button>
                    </div>
                    <small class="text-muted mt-1 d-block">Minimum 8 characters</small>
                </div>

                <!-- ===== CONFIRM PASSWORD ===== -->
                <div class="col-md-6 mb-2">
                    <label class="form-label"><i class="fas fa-check-circle me-2"></i>Confirm Password *</label>
                    <div class="password-wrapper">
                        <i class="fas fa-lock icon-left"></i>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'confirmIcon')" tabindex="-1">
                            <i class="fas fa-eye" id="confirmIcon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mb-2 form-check mt-2">
                <input type="checkbox" class="form-check-input" id="terms" required style="cursor: pointer;">
                <label class="form-check-label" for="terms" style="cursor: pointer; color: #6c757d; font-size: 13px;">
                    I agree to the <a href="#" class="text-primary text-decoration-none fw-bold">Terms & Conditions</a> and <a href="#" class="text-primary text-decoration-none fw-bold">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" id="registerBtn">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="../login.html">Login</a>
        </div>
        <div class="home-link">
            <a href="../index.html"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // ==================== PASSWORD VISIBILITY ====================
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash text-primary';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ==================== ALERTS ====================
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // ==================== REAL-TIME PASSWORD MATCH ====================
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirm = this.value;

            if (confirm.length > 0 && password !== confirm) {
                this.style.borderColor = '#dc3545';
            } else if (confirm.length > 0 && password === confirm) {
                this.style.borderColor = '#28a745';
            } else {
                this.style.borderColor = '#e9ecef';
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            const confirm = document.getElementById('confirmPassword');
            if (confirm.value.length > 0) {
                if (this.value === confirm.value) {
                    confirm.style.borderColor = '#28a745';
                } else {
                    confirm.style.borderColor = '#dc3545';
                }
            }
        });

        // ==================== REGISTER STUDENT ====================
        async function registerStudent(event) {
            event.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const rollNumber = document.getElementById('rollNumber').value.trim();
            const educationLevel = document.getElementById('educationLevel').value;
            const department = document.getElementById('department').value.trim();
            const semester = document.getElementById('semester').value;
            const cgpa = document.getElementById('cgpa').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'warning');
                document.getElementById('password').focus();
                return false;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'warning');
                document.getElementById('confirmPassword').focus();
                return false;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Creating Account...';

            try {
                const response = await fetch(`${API_URL}/auth/register/student`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: firstName + ' ' + lastName,
                        email: email,
                        rollNumber: rollNumber,
                        password: password,
                        phone: phone,
                        department: department,
                        semester: semester,
                        cgpa: parseFloat(cgpa)
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Account created successfully! Redirecting to login...', 'success');
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        window.location.href = '../login.html';
                    }, 3000);
                } else {
                    const errorMsg = result.errors
                        ? result.errors.map(e => e.msg).join(', ')
                        : result.message || 'Registration failed';
                    showAlert(errorMsg, 'danger');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('Server error. Please try again.', 'danger');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Create Account';

            return false;
        }
    </script>
</body>
</html>
