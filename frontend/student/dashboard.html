<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap"></i> Student Dashboard</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="internships.html" class="text-decoration-none">
                            <i class="fas fa-briefcase fa-3x text-primary"></i>
                            <h5 class="mt-2">Browse Internships</h5>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="applications.html" class="text-decoration-none">
                            <i class="fas fa-file-alt fa-3x text-success"></i>
                            <h5 class="mt-2">My Applications</h5>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="tasks.html" class="text-decoration-none">
                            <i class="fas fa-tasks fa-3x text-warning"></i>
                            <h5 class="mt-2">My Tasks</h5>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="progress.html" class="text-decoration-none">
                            <i class="fas fa-chart-line fa-3x text-primary"></i>
                            <h5 class="mt-2">My Progress</h5>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="feedback.html" class="text-decoration-none">
                            <i class="fas fa-comment fa-3x text-info"></i>
                            <h5 class="mt-2">Feedback</h5>
                        </a>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/student.js"></script>
    <script>
        const user = getUser();
        if (user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('studentName').textContent = user.name;
        }
    </script>
</body>
</html>
