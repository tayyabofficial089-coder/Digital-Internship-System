<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h2><i class="fas fa-lock"></i> Digital Internship</h2>
                <p>Forgot Password</p>
            </div>

            <div id="alertContainer"></div>

            <form id="forgotForm" onsubmit="return submitForgot(event)">
                <p class="text-muted small mb-4 text-center">Enter your email address and we will send you a link to reset your password.</p>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary w-100">Send Reset Link</button>
            </form>
            <p class="text-center mt-3">
                <a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `${message} <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>`;
            container.appendChild(alert);
        }

        async function submitForgot(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('alertContainer').innerHTML = ''; // clear previous
                    let msg = 'Password reset link sent to your email.';
                    if (result.resetToken) { // dev mode support
                        msg += `<br><br><small>Dev Mode Link: <a href="reset-password.html?token=${result.resetToken}">Reset Password</a></small>`;
                    }
                    showAlert(msg, 'success');
                    document.getElementById('email').value = '';
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                showAlert('Server error. Please try again.', 'danger');
            }

            btn.disabled = false;
            btn.innerHTML = 'Send Reset Link';
        }
    </script>
</body>
</html>
