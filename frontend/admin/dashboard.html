<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-user-shield"></i> Admin Dashboard</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="manage-users.html" class="text-decoration-none">
                            <i class="fas fa-users fa-3x text-primary"></i>
                            <h5 class="mt-2">Manage Users</h5>
                            <p class="text-muted small">Approve/Reject/Block users</p>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="verify-internships.html" class="text-decoration-none">
                            <i class="fas fa-check-circle fa-3x text-success"></i>
                            <h5 class="mt-2">Verify Internships</h5>
                            <p class="text-muted small">Verify completed internships</p>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <a href="reports.html" class="text-decoration-none">
                            <i class="fas fa-chart-bar fa-3x text-info"></i>
                            <h5 class="mt-2">Generate Reports</h5>
                            <p class="text-muted small">View system reports</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div id="stats"></div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        const user = getUser();
        if (user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('adminName').textContent = user.name;
        } else {
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
