<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Internships</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-user-shield"></i> Admin Dashboard</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2><i class="fas fa-check-circle"></i> Verify Internships</h2>
        <hr>
        <div id="internshipsList">
            <div class="text-center p-5">
                <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                <p class="mt-3">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        if (!token) window.location.href = '../login.html';

        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../index.html';
        });

        async function loadInternships() {
            try {
                const response = await fetch(`${API_URL}/admin/internships/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    let html = '<div class="list-group">';
                    result.data.forEach(item => {
                        html += `
                            <div class="list-group-item">
                                <h5>${item.title}</h5>
                                <p><strong>Company:</strong> ${item.companyName}</p>
                                <p><strong>Students:</strong> ${item.students?.length || 0}</p>
                                <button class="btn btn-success btn-sm" onclick="verifyInternship(${item.id})">Verify</button>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('internshipsList').innerHTML = html;
                } else {
                    document.getElementById('internshipsList').innerHTML = `
                        <div class="text-center p-5">
                            <i class="fas fa-check-circle fa-3x text-success"></i>
                            <h5 class="mt-3">No Internships Pending Verification</h5>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('internshipsList').innerHTML = '<div class="alert alert-danger">Error loading internships</div>';
            }
        }

        async function verifyInternship(id) {
            if (!confirm('Verify this internship?')) return;
            await fetch(`${API_URL}/admin/internships/${id}/verify`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadInternships();
        }

        loadInternships();

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('userName').textContent = user.name || 'Admin';
    </script>
</body>
</html>
