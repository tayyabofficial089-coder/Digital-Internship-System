<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-user-shield"></i> Admin Dashboard</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2><i class="fas fa-chart-bar"></i> Generate Reports</h2>
        <hr>

        <div class="row mb-4">
            <div class="col-md-3"><button class="btn btn-primary w-100 mb-2" onclick="generateReport('students')"><i class="fas fa-user-graduate"></i> Students</button></div>
            <div class="col-md-3"><button class="btn btn-success w-100 mb-2" onclick="generateReport('companies')"><i class="fas fa-building"></i> Companies</button></div>
            <div class="col-md-3"><button class="btn btn-warning w-100 mb-2" onclick="generateReport('internships')"><i class="fas fa-briefcase"></i> Internships</button></div>
            <div class="col-md-3"><button class="btn btn-info w-100 mb-2" onclick="generateReport('applications')"><i class="fas fa-file-alt"></i> Applications</button></div>
        </div>

        <div id="reportContent"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        if (!token) window.location.href = '../login.html';

        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../index.html';
        });

        function buildTable(type, data) {
            if (!data || !data[type] || data[type].length === 0) {
                return '<div class="alert alert-info mt-3"><i class="fas fa-info-circle"></i> No records found for this report.</div>';
            }

            const items = data[type];
            let html = '<div class="table-responsive mt-3"><table class="table table-bordered table-hover table-striped">';
            
            if (type === 'students') {
                html += '<thead class="table-dark"><tr><th>Name</th><th>Email</th><th>Roll Number</th><th>Department</th><th>Semester</th><th>CGPA</th><th>Status</th></tr></thead><tbody>';
                items.forEach(s => {
                    html += `<tr>
                        <td>${s.User?.name || 'N/A'}</td>
                        <td>${s.User?.email || 'N/A'}</td>
                        <td>${s.rollNumber || 'N/A'}</td>
                        <td>${s.department || 'N/A'}</td>
                        <td>${s.semester || 'N/A'}</td>
                        <td>${s.cgpa || 'N/A'}</td>
                        <td><span class="badge bg-${s.User?.status === 'approved' ? 'success' : (s.User?.status === 'blocked' ? 'danger' : 'warning')}">${s.User?.status || 'N/A'}</span></td>
                    </tr>`;
                });
            } 
            else if (type === 'companies') {
                html += '<thead class="table-dark"><tr><th>Company Name</th><th>Email</th><th>Industry</th><th>Location</th><th>Status</th></tr></thead><tbody>';
                items.forEach(c => {
                    html += `<tr>
                        <td>${c.User?.name || 'N/A'}</td>
                        <td>${c.User?.email || 'N/A'}</td>
                        <td>${c.industry || 'N/A'}</td>
                        <td>${c.location || 'N/A'}</td>
                        <td><span class="badge bg-${c.User?.status === 'approved' ? 'success' : (c.User?.status === 'blocked' ? 'danger' : 'warning')}">${c.User?.status || 'N/A'}</span></td>
                    </tr>`;
                });
            }
            else if (type === 'internships') {
                html += '<thead class="table-dark"><tr><th>Title</th><th>Company</th><th>Location</th><th>Duration</th><th>Stipend</th><th>Status</th></tr></thead><tbody>';
                items.forEach(i => {
                    html += `<tr>
                        <td>${i.title || 'N/A'}</td>
                        <td>${i.CompanyHR?.User?.name || 'N/A'}</td>
                        <td>${i.location || 'N/A'}</td>
                        <td>${i.duration || 'N/A'}</td>
                        <td>${i.stipend || 'Unpaid'}</td>
                        <td><span class="badge bg-${i.status === 'open' ? 'success' : (i.status === 'closed' ? 'danger' : 'secondary')}">${i.status || 'N/A'}</span></td>
                    </tr>`;
                });
            }
            else if (type === 'applications') {
                html += '<thead class="table-dark"><tr><th>Student Name</th><th>Internship Title</th><th>Company</th><th>Status</th><th>Applied Date</th></tr></thead><tbody>';
                items.forEach(a => {
                    const appliedDate = new Date(a.createdAt).toLocaleDateString();
                    html += `<tr>
                        <td>${a.Student?.User?.name || 'N/A'}</td>
                        <td>${a.Internship?.title || 'N/A'}</td>
                        <td>${a.Internship?.CompanyHR?.User?.name || 'N/A'}</td>
                        <td><span class="badge bg-${['hired', 'accepted'].includes(a.status) ? 'success' : (a.status === 'rejected' ? 'danger' : 'info')}">${a.status || 'N/A'}</span></td>
                        <td>${appliedDate}</td>
                    </tr>`;
                });
            }
            
            html += '</tbody></table></div>';
            
            let summaryHtml = '<div class="alert alert-light border"><strong><i class="fas fa-list-ol"></i> Total Records:</strong> ' + (data.total || items.length) + '</div>';
            
            return summaryHtml + html;
        }

        async function generateReport(type) {
            document.getElementById('reportContent').innerHTML = '<div class="text-center my-5"><i class="fas fa-spinner fa-spin fa-3x text-primary"></i><p class="mt-3">Generating Report...</p></div>';
            
            try {
                const response = await fetch(`${API_URL}/admin/reports/${type}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();

                if (result.success) {
                    const tableHtml = buildTable(type, result.data);
                    document.getElementById('reportContent').innerHTML = `
                        <div class="card shadow-sm border-0 mt-3">
                            <div class="card-header bg-white border-bottom-0 pb-0 pt-4">
                                <h4 class="mb-0 text-primary"><i class="fas fa-chart-pie"></i> ${result.title}</h4>
                                <p class="text-muted small mt-1">Generated on: ${new Date(result.generatedAt).toLocaleString()}</p>
                            </div>
                            <div class="card-body pt-0">
                                ${tableHtml}
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('reportContent').innerHTML = '<div class="alert alert-danger mt-3">' + (result.message || 'Failed to fetch report.') + '</div>';
                }
            } catch (error) {
                console.error('Report Error:', error);
                document.getElementById('reportContent').innerHTML = '<div class="alert alert-danger mt-3">Error generating report. Please try again.</div>';
            }
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('userName').textContent = user.name || 'Admin';
    </script>
</body>
</html>
