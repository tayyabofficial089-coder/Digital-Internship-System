<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h2><i class="fas fa-key"></i> Digital Internship</h2>
                <p>Reset Password</p>
            </div>

            <div id="alertContainer"></div>

            <form id="resetForm" onsubmit="return submitReset(event)">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" minlength="8" required>
                    <small class="text-muted">Minimum 8 characters</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary w-100">Update Password</button>
            </form>
            <p class="text-center mt-3">
                <a href="index.html">Back to Home</a>
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `${message} <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>`;
            container.appendChild(alert);
        }

        async function submitReset(event) {
            event.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showAlert('Invalid or missing reset token. Please request a new link.', 'danger');
                return;
            }

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match!', 'danger');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('resetForm').style.display = 'none';
                    showAlert('Password updated successfully! You can now log in.', 'success');
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                showAlert('Server error. Please try again.', 'danger');
            }

            btn.disabled = false;
            btn.innerHTML = 'Update Password';
        }
    </script>
</body>
</html>
